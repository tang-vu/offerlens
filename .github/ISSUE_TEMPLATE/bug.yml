name: Bug report
description: Report a reproducible OfferLens defect using synthetic data only.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include real résumé data, tokens, report cookies, or security vulnerabilities. Follow SECURITY.md for private reports.
  - type: textarea
    id: impact
    attributes:
      label: What happened?
      description: Explain the observed behavior and candidate/user impact.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Synthetic reproduction
      description: Include minimal fictional inputs and exact steps.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I removed personal data, secrets, access tokens, and ownership cookies.
          required: true
